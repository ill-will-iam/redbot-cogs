name: README cog catalog

on:
  push:
    paths:
      - "README.md"
      - "*/info.json"
      - "*/__init__.py"
      - "serveraudit/*.py"
      - "sexiness/*.py"
      - "purge/*.py"
      - "tests/test_sexiness.py"
      - "tests/test_readme_catalog.py"
      - "autoresponder/*.py"
      - "tests/test_autoresponder.py"
      - ".github/workflows/readme-catalog.yml"
  pull_request:
    paths:
      - "README.md"
      - "*/info.json"
      - "*/__init__.py"
      - "serveraudit/*.py"
      - "sexiness/*.py"
      - "purge/*.py"
      - "tests/test_sexiness.py"
      - "tests/test_readme_catalog.py"
      - "autoresponder/*.py"
      - "tests/test_autoresponder.py"
      - ".github/workflows/readme-catalog.yml"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check custom cog Python syntax
        run: python3 -m compileall -q serveraudit sexiness purge autoresponder
      - name: Test AutoResponder global matching and permissions
        run: python3 -m unittest discover -s tests -p test_autoresponder.py -v
      - name: Verify all cog packages appear in the README
        run: python3 -m unittest discover -s tests -p test_readme_catalog.py -v
