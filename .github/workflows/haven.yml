name: Haven reset checks
on:
  push:
    paths: ["haven/**", "tests/test_haven_reset.py", ".github/workflows/haven.yml"]
  pull_request:
    paths: ["haven/**", "tests/test_haven_reset.py", ".github/workflows/haven.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install discord.py==2.7.1
      - run: python -m compileall -q haven
      - run: python -m unittest discover -s tests -p test_haven_reset.py -v
      - run: python -m unittest discover -s tests -p test_readme_catalog.py -v
